services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://medicart:medicart_dev_only@database:5432/medicart
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medicart
      POSTGRES_USER: medicart
      POSTGRES_PASSWORD: medicart_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicart -d medicart"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
